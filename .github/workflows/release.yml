name: Release

# release-please keeps a release PR open from conventional commits on main
# (feat:, fix:, …). Merging it tags the version and creates the GitHub
# release; GoReleaser then attaches the binaries and checksums.txt.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please.json
          manifest-file: .github/release-please-manifest.json

      - if: steps.release.outputs.release_created
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - if: steps.release.outputs.release_created
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - if: steps.release.outputs.release_created
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
