name: Release

# release-please keeps a release PR open from conventional commits on main
# (feat:, fix:, …). Merging it tags the version and creates the GitHub
# release; GoReleaser then attaches the binaries and checksums.txt.
on:
  push:
    branches: [main]
  # Build the binaries again for an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please.json
          manifest-file: .github/release-please-manifest.json

  binaries:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
