name: VM images

# Builds the VM images of images/ for fleetingd on GitHub's runners, for
# amd64: github (actions/runner and what workflows for GitHub's runners use)
# and gitlab (Docker for gitlab-runner's docker-autoscaler). Each build is a
# release of its own (vm-image-<image>-<date>-<run>); the release
# vm-image-<image> holds one SHA256SUMS per architecture naming the newest,
# which is what fleetingd's vm_image_url points at.
#
# Rebuilt every Monday, and on other days when actions/runner has a new
# release. A push that changes images/ builds and checks without publishing.
on:
  schedule:
    - cron: "17 4 * * 1" # weekly
    - cron: "47 5 * * *" # daily, only for a new actions/runner
  workflow_dispatch:
  push:
    paths:
      - images/**
      - .github/workflows/images.yml

permissions:
  contents: read

env:
  # fleetingd with build-image, and Cloud Hypervisor.
  FLEETINGD_REF: f1b2641883aeb761075a84534c1944a0336184fd # main
  CH_VERSION: "54.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.plan.outputs.runner }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runner=$(gh release view -R actions/runner --json tagName --jq .tagName | sed 's/^v//')
          published=$(gh release view vm-image-github -R "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null | sed -n 's/^runner=//p' || true)
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "${{ github.event.schedule }}" = "47 5 * * *" ] && [ "$runner" = "$published" ]; then
            build=false
          fi
          publish=false
          if [ "$GITHUB_EVENT_NAME" != push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            publish=true
          fi
          echo "actions/runner $runner, published image has ${published:-none}: build=$build publish=$publish"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [github, gitlab]
        arch: [amd64]
        include:
          - arch: amd64
            os: ubuntu-24.04
            ch: cloud-hypervisor-static
          # arm64 waits for a runner with /dev/kvm: GitHub's arm64 ones
          # have none, and Cloud Hypervisor needs it.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: nesty92/fleeting-plugin-fleetingd
          ref: ${{ env.FLEETINGD_REF }}
          path: fleetingd
      - uses: actions/setup-go@v6
        with:
          go-version-file: fleetingd/go.mod
          cache: false
      - name: Tools
        run: |
          test -e /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-utils nftables
          sudo curl -fsSL -o /usr/local/bin/cloud-hypervisor \
            "https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/v$CH_VERSION/${{ matrix.ch }}"
          sudo chmod 755 /usr/local/bin/cloud-hypervisor
          # Docker on the runner drops forwarded packets, the build VM's
          # included; let them through.
          sudo sysctl -q -w net.ipv4.ip_forward=1
          sudo iptables -P FORWARD ACCEPT
          # The release workflow bundles these; build-image doesn't need them.
          cp fleetingd/LICENSE fleetingd/cmd/fleeting-plugin-fleetingd/
          echo "fleeting-plugin-fleetingd $FLEETINGD_REF" > fleetingd/cmd/fleeting-plugin-fleetingd/NOTICE
          (cd fleetingd && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fleeting-plugin-fleetingd" ./cmd/fleeting-plugin-fleetingd)
      - name: Build
        timeout-minutes: 25
        env:
          RUNNER_VERSION: ${{ needs.plan.outputs.runner }}
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$RUNNER_TEMP/build
          mkdir -p "$dir"
          # The build VM gets actions/runner from this machine, downloaded
          # here with the job's token: GitHub times out anonymous downloads
          # at times.
          mirror=
          if [ "$IMAGE" = github ]; then
            mkdir -p "$RUNNER_TEMP/mirror"
            gh release download "v$RUNNER_VERSION" -R actions/runner -D "$RUNNER_TEMP/mirror" \
              -p "actions-runner-linux-x64-$RUNNER_VERSION.tar.gz" -p "actions-runner-linux-arm64-$RUNNER_VERSION.tar.gz"
            host=$(ip -o route get 1.1.1.1 | sed -n 's/.* src \([^ ]*\).*/\1/p')
            python3 -m http.server -b "$host" -d "$RUNNER_TEMP/mirror" 18780 >/dev/null 2>&1 &
            mirror=http://$host:18780
          fi
          sed -e "s|@DIR@|$dir|g" -e "s|@RUNNER_VERSION@|$RUNNER_VERSION|g" -e "s|@RUNNER_MIRROR@|$mirror|g" \
            -e "s|\"egress_interface\": \"eth0\"|\"egress_interface\": \"$(ip -o route get 1.1.1.1 | sed -n 's/.* dev \([^ ]*\).*/\1/p')\"|" \
            images/$IMAGE.json > "$dir/$IMAGE.json"
          sudo "$RUNNER_TEMP/fleeting-plugin-fleetingd" build-image -config "$dir/$IMAGE.json" -out out -name "$IMAGE"
          sudo chown -R "$(id -u)" out
          mv out/SHA256SUMS out/$IMAGE-${{ matrix.arch }}.SHA256SUMS
          ls -la out
          size=$(stat -c %s out/$IMAGE-${{ matrix.arch }}.qcow2)
          [ "$size" -lt 2000000000 ] || { echo "::error::image is $size bytes, over a release asset's 2 GiB"; exit 1; }
      - name: The build VM's console
        if: failure()
        run: |
          ip -o addr; ip route; sudo nft list ruleset | head -60
          sudo sh -c 'tail -c 30000 "$0"/build/vms/.instance_data/*_console' "$RUNNER_TEMP" | tr -d '\r'
      - name: Check
        run: |
          set -o pipefail
          sudo images/verify.sh out/${{ matrix.image }}-${{ matrix.arch }}.qcow2 ${{ matrix.image }} ${{ needs.plan.outputs.runner }} | tee out/${{ matrix.image }}-${{ matrix.arch }}.manifest
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-${{ matrix.arch }}
          path: out/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_VERSION: ${{ needs.plan.outputs.runner }}
        run: |
          set -eu
          cd out
          ls -la
          base=https://github.com/$GITHUB_REPOSITORY/releases/download
          for image in github gitlab; do
            tag=vm-image-$image-$(date -u +%Y%m%d)-$GITHUB_RUN_NUMBER
            {
              echo "The $image VM image for fleetingd, built from Ubuntu's daily cloud image."
              echo "Point vm_image_url at $base/vm-image-$image/$image-{arch}.SHA256SUMS for the newest,"
              echo "or at $base/$tag/$image-{arch}.SHA256SUMS to stay on this one."
              echo
              echo '```'
              sed -n '/^--- manifest/,$p' $image-amd64.manifest | tail -n +2
              echo '```'
            } > notes-$image.md
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "VM image $image, $(date -u +%F)" --notes-file notes-$image.md \
              $image-*.qcow2 $image-*.vmlinuz $image-*.SHA256SUMS
            # The newest: the same sums, with the dated release's URLs.
            mkdir -p latest
            for f in $image-*.SHA256SUMS; do
              sed "s| \*| $base/$tag/|" "$f" > "latest/$f"
            done
            if ! gh release view vm-image-$image -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create vm-image-$image -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
                --title "VM image $image, newest" --notes "runner=$RUNNER_VERSION"
            fi
            gh release upload vm-image-$image -R "$GITHUB_REPOSITORY" --clobber latest/$image-*.SHA256SUMS
            gh release edit vm-image-$image -R "$GITHUB_REPOSITORY" --notes "$(printf 'The newest %s VM image: %s\n\nrunner=%s\n' "$image" "$tag" "$RUNNER_VERSION")"
            # Keep the four newest dated images.
            gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
              | grep "^vm-image-$image-[0-9]" | sort -r | tail -n +5 \
              | xargs -r -n1 gh release delete -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
