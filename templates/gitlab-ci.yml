# fleetci's GitLab CI template: one hidden job per standard class.
# Written from StandardClasses in internal/fleetci: go test ./internal/fleetci -update
#
#   include:
#     - remote: https://raw.githubusercontent.com/nesty92/fleetci/<version>/templates/gitlab-ci.yml
#   build:
#     extends: .fleetci-4vcpu-8gb   # .fleetci: the runner's default class
#
# A class the runner lacks fails when the job starts. Classes of your own
# go in a local include after this one ("fleetci ci-include -extra").

.fleetci:
  tags: [fleetci]

.fleetci-1vcpu-2gb:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 1vcpu-2gb

.fleetci-2vcpu-4gb:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 2vcpu-4gb

.fleetci-4vcpu-8gb:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 4vcpu-8gb

.fleetci-8vcpu-16gb:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 8vcpu-16gb

.fleetci-16vcpu-32gb:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 16vcpu-32gb

.fleetci-1vcpu-2gb-arm:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 1vcpu-2gb-arm

.fleetci-2vcpu-4gb-arm:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 2vcpu-4gb-arm

.fleetci-4vcpu-8gb-arm:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 4vcpu-8gb-arm

.fleetci-8vcpu-16gb-arm:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 8vcpu-16gb-arm

.fleetci-16vcpu-32gb-arm:
  extends: .fleetci
  variables:
    FLEETCI_CLASS: 16vcpu-32gb-arm
